# Config hermes-agent cho vul-hunting.
# File này được mount vào /opt/data/config.yaml trong container hermes (compose).
# Lưu ý: `model.default` phải khớp OPENROUTER_MODEL trong `.env` — đổi 1 thì đổi cả 2.

model:
  provider: "openrouter"
  default: "nvidia/nemotron-3.5-lightning:free"
  base_url: "https://openrouter.ai/api/v1"

terminal:
  backend: "local"
  cwd: "/opt/data/workspace"
  timeout: 180

# Headless qua API server: mặc định DENY mọi lệnh cần duyệt (không có ai bấm approve).
approvals:
  mode: "smart"
  timeout: 300
  cron_mode: "deny"
  single_query_mode: "deny"
  unattended_mode: "deny"

# Lệnh khớp pattern (fnmatch glob) chạy không cần duyệt — chỉ read-only/recon an toàn.
# Bổ sung dần theo từng ticket (recon, verification) — KHÔNG hardcode trong code worker.
command_allowlist:
  - "ls*"
  - "pwd"
  - "cat *"
  - "head *"
  - "tail *"
  - "grep *"
  - "rg *"
  - "wc *"
  - "file *"
  - "sort *"
  - "uniq *"
  - "find *"
  - "stat *"
  - "dig *"
  - "whois *"
  - "host *"
  - "python3 *"
  - "pip list*"
  - "docker ps*"

# MCP toolset của sandbox bridge (ticket #11, ADR-0003) — tool
# `mcp_sandbox_run_in_sandbox` là CỬA DUY NHẤT để payload verify chạm target:
# container --rm mới tinh cho mỗi call, network --internal, egress qua proxy
# của worker (Scope + header định danh + rate limit + egress log).
mcp_servers:
  sandbox:
    url: "http://worker:8000/mcp"
    headers:
      Authorization: "Bearer ${SANDBOX_MCP_KEY}"
    # tool call timeout phải LỚN hơn cap timeout sandbox (SANDBOX_MAX_TIMEOUT_S)
    timeout: 660
    tools:
      prompts: false
      resources: false
