name: vul-hunting

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulhunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vulhunt}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulhunt} -d ${POSTGRES_DB:-vulhunt}"]
      interval: 5s
      timeout: 3s
      retries: 10

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: vulhunt-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      # cho ${SANDBOX_MCP_KEY} trong config.yaml (mcp_servers.sandbox.headers)
      SANDBOX_MCP_KEY: ${SANDBOX_MCP_KEY}
    volumes:
      - hermes_data:/opt/data
      - ./config/hermes/config.yaml:/opt/data/config.yaml:ro
      - ./config/hermes/skills:/opt/data/skills
    # KHÔNG có `ports:` — API server chỉ lắng nghe trong mạng nội bộ compose
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8642/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Image tooling: subfinder/amass/dnsx/naabu/httpx + katana/gau/waymore/gf
  # pin version (ticket #8, #9) — build xong là xong (entrypoint true); worker
  # chạy tool từ image này qua docker.sock (sibling container, mô hình ADR-0003)
  tooling:
    build: ./docker/tooling
    image: vulhunt-tooling:latest
    entrypoint: ["true"]
    restart: "no"

  worker:
    build: ./apps/worker
    # tên tắt để `docker network connect` gắn worker vào network --internal
    # của từng verify session (sandbox bridge, ticket #11)
    container_name: vulhunt-worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vulhunt}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-vulhunt}
      HERMES_API_URL: http://hermes:8642
      HERMES_API_KEY: ${HERMES_API_SERVER_KEY}
      HACKERONE_USERNAME: ${HACKERONE_USERNAME}
      HACKERONE_API_TOKEN: ${HACKERONE_API_TOKEN}
      INTIGRITI_API_TOKEN: ${INTIGRITI_API_TOKEN}
      INTIGRITI_USERNAME: ${INTIGRITI_USERNAME:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      TOOLING_IMAGE: vulhunt-tooling:latest
      ARTIFACTS_DIR: /data/artifacts
      RECON_VOLUME: vul-hunting_recon_data
      # ── sandbox bridge (ticket #11) ──
      SANDBOX_MCP_KEY: ${SANDBOX_MCP_KEY}
    ports:
      - "${WORKER_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - recon_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      tooling:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: ./apps/web
    environment:
      WORKER_API_URL: http://worker:8000
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  hermes_data:
  recon_data:
